name: Daily EPG + TMDB + CF Pages Rebuild

# EPG + TMDB girano su Contabo (Postgres locale) alle 04:00 / 04:45 Europe/Berlin.
# Questo workflow: riesegue TMDB via SSH (idempotente) + SEO notifier + trigger CF Pages.
on:
  schedule:
    - cron: '32 3 * * *'   # 03:32 UTC ≈ 05:32 CEST

  workflow_dispatch:
    inputs:
      run_tmdb:
        description: 'Esegui TMDB enrichment su Contabo'
        type: boolean
        default: true
      trigger_cf:
        description: 'Triggera rebuild Cloudflare Pages'
        type: boolean
        default: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) Enrichment TMDB (su Contabo — Supabase DE non esiste più)
  # ──────────────────────────────────────────────────────────
  tmdb-enrichment:
    name: TMDB Enrichment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_tmdb == true }}

    steps:
      - name: Run TMDB enrichment on Contabo VPS
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${CONTABO_SSH_KEY:-}" ] || [ -z "${CONTABO_HOST:-}" ]; then
            echo "::error::Missing CONTABO_SSH_KEY or CONTABO_HOST secrets"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan -H "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/contabo_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "root@${CONTABO_HOST}" \
            '/root/epg_importers/fernsehheute/scripts/run_tmdb.sh'

  # ──────────────────────────────────────────────────────────
  # 2) SEO Notifier
  # ──────────────────────────────────────────────────────────
  seo-notifier:
    name: SEO Notifier
    runs-on: ubuntu-latest
    needs: tmdb-enrichment
    permissions:
      contents: write
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.run_tmdb == true) &&
      needs.tmdb-enrichment.result != 'cancelled'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/python/requirements.txt

      - name: Install dependencies
        working-directory: scripts/python
        run: pip install -r requirements.txt

      - name: Run SEO notifier
        working-directory: scripts/python
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GOOGLE_INDEXING_ENABLED: '1'
          GOOGLE_URL_INSPECTION_ENABLED: '1'
          GOOGLE_SEARCH_ANALYTICS_ENABLED: '1'
          INDEXNOW_ENABLED: '1'
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          WEBSUB_ENABLED: '1'
          PUBLIC_DIR: ${{ github.workspace }}/public
          SITE_URL: 'https://fernsehheute.de'
        run: python3 seo_notifier.py
        continue-on-error: true

      - name: Commit SEO reports
        working-directory: ${{ github.workspace }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/seo-data/ || true
          git diff --staged --quiet || git commit -m "chore: update SEO reports [skip ci]"
          git push || true

  # ──────────────────────────────────────────────────────────
  # 3) Build Astro su Contabo + deploy Cloudflare Pages (wrangler)
  # ──────────────────────────────────────────────────────────
  cloudflare-rebuild:
    name: Rebuild Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [tmdb-enrichment, seo-notifier]
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.trigger_cf == true) &&
      needs.tmdb-enrichment.result != 'cancelled'

    steps:
      - name: Build + deploy on Contabo VPS
        env:
          CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${CONTABO_SSH_KEY:-}" ] || [ -z "${CONTABO_HOST:-}" ]; then
            echo "::error::Missing CONTABO_SSH_KEY or CONTABO_HOST secrets"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/contabo_key
          chmod 600 ~/.ssh/contabo_key
          ssh-keyscan -H "$CONTABO_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/contabo_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes \
            "root@${CONTABO_HOST}" \
            '/var/www/fernsehheute.de/astro/scripts/rebuild-and-deploy-vps.sh'
