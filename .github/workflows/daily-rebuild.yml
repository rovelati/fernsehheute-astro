name: Daily EPG + TMDB + CF Pages Rebuild

# Esegue ogni giorno alle 05:30 Berlin (03:30 UTC in estate, 04:30 in inverno)
# L'EPG importer gira sul server alle ~04:00, quindi alle 05:30 i dati sono già aggiornati
on:
  schedule:
    - cron: '32 3 * * *'   # 03:32 UTC ≈ 05:32 CEST (estate)

  # Trigger manuale dalla UI di GitHub Actions
  workflow_dispatch:
    inputs:
      run_tmdb:
        description: 'Esegui TMDB enrichment'
        type: boolean
        default: true
      trigger_cf:
        description: 'Triggera rebuild Cloudflare Pages'
        type: boolean
        default: true

jobs:
  # ──────────────────────────────────────────────────────────
  # 1) Enrichment TMDB
  # ──────────────────────────────────────────────────────────
  tmdb-enrichment:
    name: TMDB Enrichment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || inputs.run_tmdb == true }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/python/requirements.txt

      - name: Install dependencies
        working-directory: scripts/python
        run: pip install -r requirements.txt

      - name: Run TMDB enrichment
        working-directory: scripts/python
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PROGRAMS_TABLE:    programs_de
          SUPABASE_ENRICHMENT_TABLE:  content_enrichment_de
          TMDB_API_KEY:         ${{ secrets.TMDB_API_KEY }}
          TMDB_LANGUAGE:        de
          TMDB_MAX_PROGRAMS:    300
          TMDB_LOOKBACK_DAYS:   1
          TMDB_LOOKAHEAD_DAYS:  8
          TMDB_MIN_CONFIDENCE:  '0.50'
          TMDB_UPDATE_POSTER_URL: '1'
        run: python3 tmdb_enrichment_importer.py

      - name: Run Wikipedia/content enrichment
        working-directory: scripts/python
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PROGRAMS_TABLE:    programs_de
          SUPABASE_ENRICHMENT_TABLE:  content_enrichment_de
          ENRICH_LOOKBACK_DAYS: 1
          ENRICH_LOOKAHEAD_DAYS: 8
          ENRICH_MAX_PROGRAMS:  200
          ENRICH_MIN_CONFIDENCE: '0.55'
          ENRICH_WIKIPEDIA_LANG: de
        run: python3 content_enrichment_importer.py
        continue-on-error: true   # Non blocca se Wikipedia è irraggiungibile

  # ──────────────────────────────────────────────────────────
  # 2) SEO Notifier (IndexNow + Google Indexing API + WebSub + GSC reports)
  # ──────────────────────────────────────────────────────────
  seo-notifier:
    name: SEO Notifier
    runs-on: ubuntu-latest
    needs: tmdb-enrichment
    permissions:
      contents: write
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.run_tmdb == true) &&
      needs.tmdb-enrichment.result != 'cancelled'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/python/requirements.txt

      - name: Install dependencies
        working-directory: scripts/python
        run: pip install -r requirements.txt

      - name: Run SEO notifier
        working-directory: scripts/python
        env:
          GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON }}
          GOOGLE_INDEXING_ENABLED: '1'
          GOOGLE_URL_INSPECTION_ENABLED: '1'
          GOOGLE_SEARCH_ANALYTICS_ENABLED: '1'
          INDEXNOW_ENABLED: '1'
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          WEBSUB_ENABLED: '1'
          PUBLIC_DIR: ${{ github.workspace }}/astro-fernsehheute/public
          SITE_URL: 'https://fernsehheute.de'
        run: python3 seo_notifier.py
        continue-on-error: true

      - name: Commit SEO reports
        working-directory: ${{ github.workspace }}/astro-fernsehheute
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/seo-data/ || true
          git diff --staged --quiet || git commit -m "chore: update SEO reports [skip ci]"
          git push || true

  # ──────────────────────────────────────────────────────────
  # 3) Cloudflare Pages rebuild
  # ──────────────────────────────────────────────────────────
  cloudflare-rebuild:
    name: Rebuild Cloudflare Pages
    runs-on: ubuntu-latest
    needs: tmdb-enrichment
    if: |
      always() &&
      (github.event_name == 'schedule' || inputs.trigger_cf == true) &&
      needs.tmdb-enrichment.result != 'cancelled'

    steps:
      - name: Trigger CF Pages deploy hook
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK" ]; then
            echo "⚠️  CLOUDFLARE_DEPLOY_HOOK_URL non impostata — skip"
            exit 0
          fi
          echo "🚀 Triggering Cloudflare Pages rebuild..."
          RESPONSE=$(curl -s -o /tmp/cf_response.json -w "%{http_code}" \
            -X POST "$CF_DEPLOY_HOOK")
          echo "HTTP Status: $RESPONSE"
          cat /tmp/cf_response.json
          if [[ "$RESPONSE" != "200" && "$RESPONSE" != "201" ]]; then
            echo "❌ Deploy hook failed with status $RESPONSE"
            exit 1
          fi
          echo "✅ Cloudflare Pages rebuild triggered"
