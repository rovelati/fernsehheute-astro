  <!-- High-contrast White TV text -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="285" fill="#ffffff" letter-spacing="-6">TV</text>
</svg>
